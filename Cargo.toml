[package]
name = "voxel-physics-lab"
version = "0.2.0"
edition = "2021"
publish = false
default-run = "voxel-physics-lab"
description = "CPU voxel mechanics laboratory for emergent wood fracture"

[[bin]]
name = "voxel-physics-lab"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:wgpu", "dep:winit", "dep:pollster"]

[dependencies]
# Fixed API baseline; update intentionally, together with renderer code.
wgpu = { version = "=0.19.4", optional = true }
winit = { version = "=0.29.15", features = ["rwh_06"], optional = true }
glam = { version = "=0.27.0", features = ["serde"] }
serde = { version = "=1.0.203", features = ["derive"] }
ron = "=0.8.1"
rayon = "=1.10.0"
bytemuck = { version = "=1.16.3", features = ["derive"] }

# Sparse composition storage and synchronous startup of async wgpu setup.
smallvec = { version = "=1.13.2", features = ["serde"] }
pollster = { version = "=0.3.0", optional = true }

[profile.release]
debug = 1
